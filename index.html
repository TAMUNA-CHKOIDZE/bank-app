<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>THE BANK APP</title>
</head>

<body>
    <!-- bankApp -->
    <div class="bankApp">
        <h2>ბალანსი: <span id="balanceElement">0</span> ლ</h2>
        <div class="form">
            <input type="number" id="amount" placeholder="შეიყვანე თანხა">
            <div class="buttons_box">
                <button id="depositBtn" class="depositBtn">თანხის ჩარიცხვა</button>
                <button id="withdrawBtn" class="withdrawBtn">თანხის გამოტანა</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
